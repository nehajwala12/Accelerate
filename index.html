const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const key=await derive(pw);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},key,b2a(ENC.ct));
  document.body.className='';
  document.body.innerHTML=new TextDecoder().decode(pt);
  try{
    const m=await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
    m.default.initialize({startOnLoad:false,theme:'neutral',securityLevel:'loose',themeVariables:{fontFamily:'Helvetica Neue,Arial,sans-serif'}});
    await m.default.run({querySelector:'.mermaid'});
  }catch(e){}
}
async function attempt(){
  const btn=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
  btn.disabled=true;err.textContent='';
  try{await unlock(pw);sessionStorage.setItem('csw_pa_pw',pw);}
  catch(e){err.textContent='Incorrect password. Access is logged for this document.';btn.disabled=false;document.getElementById('pw').select();}
}
window.addEventListener('DOMContentLoaded',async()=>{
  document.getElementById('go').addEventListener('click',attempt);
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
  const c=sessionStorage.getItem('csw_pa_pw');
  if(c){try{await unlock(c);}catch(e){sessionStorage.removeItem('csw_pa_pw');}}
  document.getElementById('pw').focus();
});
</script>
